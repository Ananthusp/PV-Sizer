<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Weekly Progress Report</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: header (site, week, KPIs, download) · page rail on the left (one row per report slide) · the selected page on the right with its slide picture and inputs */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eaf1f8; --ink:#13263a; --muted:#5d6b7a; --line:#d8e3ee;
  --brand:#0b3a66; --brand-ink:#ffffff; --hot:#1090f1; --cta:#0f7fd8;
  --ok:#1d7f55; --warn:#a96a0c; --bad:#b8352a; --ok-bg:#e3f3ec; --warn-bg:#fbf0dc; --bad-bg:#f8e2df; --input:#ffffff;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1520; --surface:#132030; --surface-2:#1a2a3d; --ink:#e6eef7; --muted:#93a4b8; --line:#26384f;
  --brand:#7cb9ee; --brand-ink:#0c1520; --hot:#4fb0ff; --cta:#0f7fd8;
  --ok:#4fc58f; --warn:#e3a742; --bad:#ff7d70; --ok-bg:#16332a; --warn-bg:#3a2b12; --bad-bg:#3b1c1a; --input:#0f1a27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1520; --surface:#132030; --surface-2:#1a2a3d; --ink:#e6eef7; --muted:#93a4b8; --line:#26384f;
  --brand:#7cb9ee; --brand-ink:#0c1520; --hot:#4fb0ff; --cta:#0f7fd8;
  --ok:#4fc58f; --warn:#e3a742; --bad:#ff7d70; --ok-bg:#16332a; --warn-bg:#3a2b12; --bad-bg:#3b1c1a; --input:#0f1a27; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
button{font:inherit;cursor:pointer}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding-block:10px}
.logo{height:32px;width:auto;flex:none}
.ident{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 280px}
.siterow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.siterow select{font-family:var(--display);font-size:20px;font-weight:700;border:0;background:transparent;color:var(--ink);padding:0 4px 0 0;max-width:100%;width:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.cloud i{width:8px;height:8px;border-radius:50%;background:var(--muted)} .cloud.live i{background:var(--ok)} .cloud.err i{background:var(--bad)}
.kpis{display:flex;gap:6px;flex-wrap:wrap}
.kpi{padding:4px 12px;border-left:3px solid var(--line);min-width:90px}
.kpi b{display:block;font-family:var(--display);font-size:23px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi.pl{border-color:var(--brand)} .kpi.ac{border-color:var(--hot)} .kpi.var.neg b{color:var(--bad)} .kpi.var.pos b{color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--hot)}
.btn.primary{background:var(--cta);border-color:var(--cta);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.banner{margin-block:12px 0;padding:10px 14px;border-radius:8px;background:var(--warn-bg);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.banner.info{background:var(--surface-2)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;padding-block:16px 70px}
nav.rail{position:sticky;top:96px;align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 110px);overflow:auto;padding-right:4px}
.rail .rh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px 4px}
.rail button.pg{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;color:var(--ink);padding:6px 8px;border-radius:8px;font-size:14px}
.rail button.pg:hover{background:var(--surface-2)}
.rail button.pg[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
.rail button.pg .n{font-family:var(--display);font-weight:700;color:var(--hot);font-variant-numeric:tabular-nums}
.rail button.pg[aria-current="page"] .n{color:var(--brand-ink)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 7px;white-space:nowrap}
.tag.fill{background:var(--hot);color:#fff} .tag.auto{background:var(--surface-2);color:var(--muted)} .tag.carry{background:var(--ok-bg);color:var(--ok)}
.rail button.pg[aria-current="page"] .tag.auto{background:rgba(255,255,255,.18);color:inherit}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.pagehead{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.thumb{width:100%;border-radius:6px;border:1px solid var(--line);display:block;aspect-ratio:16/9;object-fit:cover;background:var(--surface-2)}
.pagehead h2{font-size:24px;font-weight:700}
.pagehead .sub{color:var(--muted);font-size:13px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.help{color:var(--muted);font-size:14px;margin:6px 0 0;max-width:72ch}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;min-width:0}
input,select,textarea{font:inherit;font-weight:400;font-size:14px;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input[readonly]{background:var(--surface-2);color:var(--muted)}
.auto{font-size:11px;font-weight:700;color:var(--hot);letter-spacing:.05em;text-transform:uppercase;margin-left:4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--brand);color:var(--brand-ink);font-weight:600;text-align:left;padding:7px 8px;font-size:12.5px;white-space:nowrap;position:sticky;top:0;z-index:1}
td{border-top:1px solid var(--line);padding:4px 6px;vertical-align:middle}
td input,td select{padding:4px 6px;font-size:13px;min-width:70px}
td.c,th.c{text-align:center} td.r{text-align:right;font-variant-numeric:tabular-nums} td.nw{white-space:nowrap;font-variant-numeric:tabular-nums}
tr.grp td{background:var(--surface-2);font-weight:700;font-family:var(--display);font-size:15px}
tr.ms td{color:var(--muted)}
td select.pct{min-width:84px;font-weight:600} td select.pct.moved{border-color:var(--hot);color:var(--hot)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.n{background:var(--surface-2);color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:5px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
canvas.preview{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ph-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.ph-card img{aspect-ratio:1.8625;object-fit:cover;width:100%;display:block}
.ph-card .meta{padding:8px;display:flex;flex-direction:column;gap:6px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:150px}
.drop:hover,.drop.over{border-color:var(--hot);color:var(--ink)}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.pt{display:flex;gap:6px;align-items:center} .pt input{flex:1}
.pn{font-family:var(--display);color:var(--muted);min-width:16px;text-align:right}
.addpt{align-self:flex-start}
.del{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.del:hover{color:var(--bad)}
.qgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.qgrid input{font-size:18px;font-family:var(--display);padding:8px 10px}
.count{font-size:12px;color:var(--muted)}
.navbtns{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
details.more summary{cursor:pointer;color:var(--hot);font-weight:600;font-size:14px;margin-block:8px 4px}
.sum-t td,.sum-t th{text-align:center} .sum-t td:nth-child(2),.sum-t th:nth-child(2){text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(5,15,28,.55);z-index:30;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .box{background:var(--surface);border-radius:12px;max-width:1000px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:22px}
.pagepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pagepick label{display:flex;flex-direction:column;gap:4px;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer}
.pagepick label.off{opacity:.45}
.pagepick img{width:100%;border-radius:4px;display:block}
.pagepick span{display:flex;gap:6px;align-items:center}
.pagepick input{width:auto}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px}
.lock form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px;width:min(360px,100%)}
.lock .err{color:var(--bad);font-size:13px;min-height:18px}
@media (max-width:980px){.layout{grid-template-columns:1fr}nav.rail{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}.rail .rh{display:none}.rail button.pg{grid-template-columns:auto auto;white-space:nowrap}.rail button.pg .tag{display:none}header.top{position:static}.pagehead{grid-template-columns:1fr}.pagehead .thumb{max-width:360px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <form id="lockForm">
    <h2>Weekly Progress Report</h2>
    <label class="f">Password<input type="password" id="lockPw" autocomplete="current-password"></label>
    <label class="row" style="font-size:13px;color:var(--muted)"><input type="checkbox" id="lockRemember" checked style="width:auto"> Remember on this computer</label>
    <div class="err" id="lockErr"></div>
    <button class="btn primary" type="submit">Open</button>
  </form>
</div>

/* ============ S2 · DATES + SCHEDULE MATHS ============ */
const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=dt=>dt.toISOString().slice(0,10);
const addD=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((D(b)-D(a))/864e5);
const dmy=s=>s?s.slice(8,10)+'-'+s.slice(5,7)+'-'+s.slice(0,4):'';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dmyS=s=>s?s.slice(8,10)+'-'+MON[+s.slice(5,7)-1]+'-'+s.slice(2,4):'';
const todayIso=()=>{const n=new Date();return iso(new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())))};
const WEEKEND={monsat:[0],monfri:[0,6],sunthu:[5,6]};
let OFF=[0];
function isWork(d){return !OFF.includes(d.getUTCDay())}
function workdays(a,b){if(!a||!b||b<a)return 0;let n=0,d=D(a),e=D(b);while(d<=e){if(isWork(d))n++;d.setUTCDate(d.getUTCDate()+1)}return n}
function weekEndDay(){return SITE?.meta?.workweek==='sunthu'?6:0}   /* Sunday, or Saturday for a Sun–Thu week */
function weekEndOfDate(s){const d=D(s),we=weekEndDay();const k=(we-d.getUTCDay()+7)%7;return addD(s,k)}
let SITE=null,S=null,TASKS=[],LEAF=[],WD={},PKGS=[],W1='',LASTW=1;
function plannedPct(t,dd){if(dd<t.start)return 0;if(dd>=t.finish)return 100;const w=WD[t.id]||1;return 100*workdays(t.start,dd)/w}
const weekNo=we=>Math.floor(diffD(W1,we)/7)+1;

const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseDate(v){ if(v==null||v==='') return '';
  if(v instanceof Date && !isNaN(v)) return iso(new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())));
  if(typeof v==='number'){ const d=new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5); return iso(d); }
  let s=String(v).trim().replace(/^[A-Za-z]{3,9},?\s+/,'').replace(/\s+\d{1,2}:\d{2}.*$/,'').replace(/T.*$/,'');
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[\/\-. ]([A-Za-z]{3,})[\/\-. ,]+(\d{2,4})$/); if(m){ const mo=MONTHS[m[2].slice(0,3).toLowerCase()]; if(mo){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${String(mo).padStart(2,'0')}-${m[1].padStart(2,'0')}`; } }
  m=s.match(/^([A-Za-z]{3,})\s+(\d{1,2}),?\s+(\d{2,4})$/); if(m){ const mo=MONTHS[m[1].slice(0,3).toLowerCase()]; if(mo){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${String(mo).padStart(2,'0')}-${m[2].padStart(2,'0')}`; } }
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/); if(m){ let a=+m[1],b=+m[2]; const y=m[3].length===2?'20'+m[3]:m[3]; let dd=a,mm=b; if(SCHED_MDY||b>12&&a<=12){ dd=b; mm=a; } return `${y}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`; }
  return ''; }
let SCHED_MDY=false;
/* dd/mm or mm/dd? if any first part is over 12 it is day-first; if any second part is over 12 it is month-first */
function detectMDY(vals){ let dayFirst=false, monFirst=false; vals.forEach(v=>{ const m=String(v??'').match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.]\d{2,4}/); if(!m) return; if(+m[1]>12) dayFirst=true; if(+m[2]>12) monFirst=true; });
  if(monFirst&&!dayFirst) SCHED_MDY=true; else if(dayFirst) SCHED_MDY=false; const cb=document.getElementById('mdy'); if(cb) cb.checked=SCHED_MDY; }
/* rows: [{id,name,start,finish,sum,ms}] → nest by date range; summary rows contain the rows under them */
function nestRows(rows){
  const stack=[]; rows.forEach(r=>{ while(stack.length){ const top=stack[stack.length-1]; if(r.start>=top.start && r.finish<=top.finish) break; stack.pop(); }
    r.lvl=stack.length; if(r.sum) stack.push(r); });
  // root: one summary containing everything
  const tops=rows.filter(r=>r.lvl===0); const hasRoot=tops.length===1 && tops[0].sum;
  const pkgLvl=hasRoot?1:0; const pkgs=[]; let curPkg=null;
  rows.forEach(r=>{ if(r.lvl===pkgLvl && (r.sum || !r.ms)){ curPkg={k:'P'+r.id,n:r.name}; pkgs.push(curPkg); if(r.sum) r.ph=true; }
    if(r.lvl<pkgLvl){ curPkg=null; return; }
    r.pkg = curPkg?curPkg.k:'GEN'; if(r.lvl===pkgLvl && !r.sum && r.ms) curPkg=null; });
  if(rows.some(r=>!r.sum && r.pkg==='GEN')) pkgs.push({k:'GEN',n:'General works'});
  rows.forEach(r=>{ if(r.sum) r.lvl=r.lvl; });
  return {tasks:rows.map(r=>({id:r.id,lvl:r.lvl,name:r.name,start:r.start,finish:r.finish,sum:!!r.sum,ms:!!r.ms,ph:!!r.ph,pkg:r.sum?'':r.pkg})), pkgs};
}

function sCurveData(){ const c=calc(), cats=[], pl=[], ac=[];
  for(let w=1;w<=LASTW;w++){ cats.push('W'+w); pl.push(Math.round(plannedOverallAt(weekEndOf(w))*10)/10);
    ac.push(w<c.wn?(S.history[w]!=null&&S.history[w]!==''?+S.history[w]:null):w===c.wn?Math.round(c.ac*10)/10:null); }
  return {cats,pl,ac,cur:c.wn}; }
function drawS(cv){ if(!cv) return; const g=cv.getContext('2d'),W=cv.width,H=cv.height,d=sCurveData(); g.fillStyle='#fff'; g.fillRect(0,0,W,H);
  const L=60,Rr=20,T=24,B=56,pw=W-L-Rr,ph=H-T-B,n=Math.max(2,d.cats.length); const x=i=>L+pw*i/(n-1), y=v=>T+ph*(1-v/100);
  g.font='15px "Source Sans 3",sans-serif'; g.textBaseline='middle';
  for(let v=0;v<=100;v+=20){ g.strokeStyle='#e3eaf1'; g.lineWidth=1; g.beginPath(); g.moveTo(L,y(v)); g.lineTo(W-Rr,y(v)); g.stroke(); g.fillStyle='#5d6b7a'; g.textAlign='right'; g.fillText(v+'%',L-8,y(v)); }
  const step=Math.ceil(n/16); g.textAlign='center'; d.cats.forEach((c,i)=>{ if(i%step===0||i===d.cur-1){ g.fillStyle=i===d.cur-1?'#1090f1':'#5d6b7a'; g.fillText(c,x(i),H-B+18); } });
  if(d.cur>=1&&d.cur<=n){ g.strokeStyle='#1090f1'; g.setLineDash([5,5]); g.beginPath(); g.moveTo(x(d.cur-1),T); g.lineTo(x(d.cur-1),H-B); g.stroke(); g.setLineDash([]); }
  const line=(arr,col)=>{ g.strokeStyle=col; g.lineWidth=3; g.beginPath(); let st=false; arr.forEach((v,i)=>{ if(v==null) return; st?g.lineTo(x(i),y(v)):(g.moveTo(x(i),y(v)),st=true); }); g.stroke(); g.fillStyle=col; arr.forEach((v,i)=>{ if(v==null) return; g.beginPath(); g.arc(x(i),y(v),3.5,0,7); g.fill(); }); };
  line(d.pl,'#0b3a66'); line(d.ac,'#1090f1');
  g.textAlign='left'; g.font='600 15px "Source Sans 3",sans-serif'; g.fillStyle='#0b3a66'; g.fillRect(L,H-18,22,4); g.fillText('Planned (cumulative %)',L+30,H-16); g.fillStyle='#1090f1'; g.fillRect(L+230,H-18,22,4); g.fillText('Actual (cumulative %)',L+260,H-16); }
function ganttRows(we){ const MAXR=30,pick=[];
  LEAF.forEach(t=>{ const a=+S.actual[t.id]||0, la=+S.lastActual[t.id]||0; const late=t.finish<=we&&a<100, moved=a>la&&t.finish>=addD(we,-21);
    const soon=!t.ms&&a<100&&t.start<=addD(we,21)&&t.finish>=we, msSoon=t.ms&&t.finish>=addD(we,-7)&&t.finish<=addD(we,28);
    if(late||moved||soon||msSoon) pick.push({t,pr:late?0:moved?1:msSoon?2:3}); });
  pick.sort((x,y)=>x.pr-y.pr||x.t.start.localeCompare(y.t.start)); const phases=TASKS.filter(t=>t.sum&&(t.ph||t.lvl===1));
  const keep=new Set(pick.slice(0,MAXR-phases.length).map(p=>p.t.id)); return TASKS.filter(t=>(t.sum&&(t.ph||t.lvl===1))||keep.has(t.id)); }

    const num=slot([457200,6172200]).filter(sp=>sp.getElementsByTagNameNS(NS.a,'prstGeom')[0]?.getAttribute('prst')!=='ellipse');
    const tit=slot([1097280,6812280]), pg=slot([5029200,10744200]);
    for(let i=0;i<circ.length;i++){ if(i<ent.length){ setText(num[i],String(i+1)); setText(tit[i],ent[i].t.replace('&amp;','&')); setText(pg[i],ent[i].pg); } else [circ[i],num[i],tit[i],pg[i]].forEach(x=>x&&x.remove()); } }
  for(const [p,d] of Object.entries(docs)) zip.file(p,serX(d));
  await dropSlides(zip, PAGES.filter(p=>!inc(p.k)).map(p=>p.f));
  return zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation'}); }
async function dropSlides(zip,files){ if(!files.length) return;
  const pres=parseX(await zip.file('ppt/presentation.xml').async('string')), prels=parseX(await zip.file('ppt/_rels/presentation.xml.rels').async('string')); let ct=await zip.file('[Content_Types].xml').async('string');
  for(const f of files){ const rel=[...prels.getElementsByTagNameNS(NS.rel,'Relationship')].find(r=>r.getAttribute('Target')===`slides/${f}.xml`); if(!rel) continue; const rid=rel.getAttribute('Id');
    [...pres.getElementsByTagNameNS(NS.p,'sldId')].forEach(e=>{ if(e.getAttributeNS(NS.r,'id')===rid) e.remove(); }); rel.remove();
    const srel=zip.file(`ppt/slides/_rels/${f}.xml.rels`); if(srel){ const sr=await srel.async('string'); const nm=sr.match(/Target="\.\.\/notesSlides\/(notesSlide\d+)\.xml"/); if(nm){ zip.remove(`ppt/notesSlides/${nm[1]}.xml`); zip.remove(`ppt/notesSlides/_rels/${nm[1]}.xml.rels`); ct=ct.replace(new RegExp(`<Override PartName="/ppt/notesSlides/${nm[1]}\\.xml"[^>]*/>`),''); } zip.remove(`ppt/slides/_rels/${f}.xml.rels`); }
    zip.remove(`ppt/slides/${f}.xml`); ct=ct.replace(new RegExp(`<Override PartName="/ppt/slides/${f}\\.xml"[^>]*/>`),''); }
  zip.file('ppt/presentation.xml',serX(pres)); zip.file('ppt/_rels/presentation.xml.rels',serX(prels)); zip.file('[Content_Types].xml',ct);
  const app=zip.file('docProps/app.xml'); if(app){ let a=await app.async('string'); a=a.replace(/<Slides>\d+<\/Slides>/,`<Slides>${PAGES.length-files.length}</Slides>`); zip.file('docProps/app.xml',a); } }
async function writeChart(zip,X,sd){ const ch=await X('ppt/charts/chart1.xml'), n=sd.cats.length;
  [...ch.getElementsByTagNameNS(NS.c,'ser')].forEach((ser,si)=>{ const vals=si===0?sd.pl:sd.ac;
    const cat=ser.getElementsByTagNameNS(NS.c,'cat')[0]; cat.getElementsByTagNameNS(NS.c,'f')[0].textContent=`Sheet1!$A$2:$A$${n+1}`; const sc=cat.getElementsByTagNameNS(NS.c,'strCache')[0];
    [...sc.getElementsByTagNameNS(NS.c,'pt')].forEach(p=>p.remove()); sc.getElementsByTagNameNS(NS.c,'ptCount')[0].setAttribute('val',n);
    sd.cats.forEach((c,i)=>{ const pt=ch.createElementNS(NS.c,'c:pt'); pt.setAttribute('idx',i); const v=ch.createElementNS(NS.c,'c:v'); v.textContent=c; pt.appendChild(v); sc.appendChild(pt); });
    const val=ser.getElementsByTagNameNS(NS.c,'val')[0]; val.getElementsByTagNameNS(NS.c,'f')[0].textContent=`Sheet1!$${si?'C':'B'}$2:$${si?'C':'B'}$${n+1}`; const nc=val.getElementsByTagNameNS(NS.c,'numCache')[0];
    [...nc.getElementsByTagNameNS(NS.c,'pt')].forEach(p=>p.remove()); nc.getElementsByTagNameNS(NS.c,'ptCount')[0].setAttribute('val',n);
    vals.forEach((x,i)=>{ if(x==null) return; const pt=ch.createElementNS(NS.c,'c:pt'); pt.setAttribute('idx',i); const v=ch.createElementNS(NS.c,'c:v'); v.textContent=String(x); pt.appendChild(v); nc.appendChild(pt); }); });
  const path='ppt/embeddings/Microsoft_Excel_Worksheet.xlsx', xz=await JSZip.loadAsync(await zip.file(path).async('arraybuffer')); let sh=await xz.file('xl/worksheets/sheet1.xml').async('string');
  const is=(r,t)=>`<c r="${r}" t="inlineStr"><is><t>${esc(t)}</t></is></c>`; let rows=`<row r="1">${is('A1','Week')}${is('B1','Planned (cumulative %)')}${is('C1','Actual (cumulative %)')}</row>`;
  sd.cats.forEach((c,i)=>{ const r=i+2; rows+=`<row r="${r}">${is('A'+r,c)}<c r="B${r}"><v>${sd.pl[i]}</v></c>${sd.ac[i]!=null?`<c r="C${r}"><v>${sd.ac[i]}</v></c>`:''}</row>`; });
  sh=sh.replace(/<sheetData>[\s\S]*<\/sheetData>|<sheetData\/>/,`<sheetData>${rows}</sheetData>`).replace(/<dimension ref="[^"]*"\/>/,`<dimension ref="A1:C${n+1}"/>`); xz.file('xl/worksheets/sheet1.xml',sh); zip.file(path,await xz.generateAsync({type:'arraybuffer',compression:'DEFLATE'})); }

let DL=null; try{ DL=window.claude?.use?window.claude.use('downloads'):null; }catch(e){ DL=null; }
async function saveFile(name,blob){ let d=null; try{ d=DL?await DL:null; }catch(e){ d=null; }

  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
let toastT; function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3800); }
function setPath(obj,path,v){ const k=path.split('.'); let o=obj; k.slice(0,-1).forEach(x=>o=o[x]); o[k[k.length-1]]=v; }

  S.report.weekEnd=addD(c.we,7); S.report.reportDate=addD(c.we,8); S.upcoming=null; S._upAuto=true; S.highlights=''; PHOTOS=[]; GANTT_UP=null; save(); renderAll();

  else if(ds.w){ S.weights[ds.w]=+t.value||0; save(); renderHeader(); }

  else if(ds.t){ S.tables[ds.t][+ds.r][+ds.c]=t.value; save(); if(ds.t==='delay'){ const cell=document.querySelector(`[data-dd="${ds.r}"]`); if(cell) cell.textContent=delayDays(S.tables.delay[+ds.r]); } }
  else if(ds.hse){ S.hse[ds.hse][+ds.r][+ds.c]=+t.value||0; save(); document.querySelectorAll(`[data-hse="${ds.hse}"][data-r="${ds.r}"][data-c="${ds.c}"]`).forEach(x=>{ if(x!==t) x.value=t.value; }); const r=S.hse[ds.hse][+ds.r], cc=document.querySelector(`[data-hcum="${ds.hse}-${ds.r}"]`); if(cc) cc.textContent=(+r[0]||0)+(+r[1]||0); updHse(); }

  else if(ds.li){ const a=listArr(ds.li); a[+ds.i]=t.value; listSet(ds.li,a); }
  else if(ds.bind){ let v=t.type==='number'?+t.value:t.value; if(ds.bind==='report.weekEnd'){ if(!v) return; v=weekEndOfDate(v); } setPath(S,ds.bind,v); save(); renderHeader(); if(ds.bind==='report.weekEnd'){ t.value=v; renderBanners(); renderPage(); } const ro=$('refOut'); if(ro) ro.value=refNo(calc()); if(ds.bind==='report.schedRev') drawGantt($('gCanvas')); if(ds.bind.startsWith('hse.')) updHse(); }
  else if(ds.pc!=null) PHOTOS[+ds.pc].caption=t.value; else if(ds.pd!=null) PHOTOS[+ds.pd].date=t.value;
  else if(ds.msd){ (S.msDate ||= {})[ds.msd]=t.value; save(); }
  else if(ds.m){ DRAFT.meta[ds.m]=t.value; } else if(ds.dref){ DRAFT.state.report.refPrefix=t.value; }
  else if(ds.rv){ const r=RAW[+ds.i]; if(ds.rv==='sum'||ds.rv==='ms') r[ds.rv]=t.checked; else r[ds.rv]=t.value; } });
function updHse(){ const c=hseCalc(); [['hTW',c.tw],['hMH',c.mh],['hMHC',c.mhCum],['hSF',c.safe],['hSFC',c.safeCum]].forEach(([id,v])=>{ const el=$(id); if(el) el.textContent=v; }); }
document.addEventListener('change',e=>{ const t=e.target, ds=t.dataset;
  if(ds.ms){ S.msDate ||= {}; if(t.checked) S.msDate[ds.ms] ||= S.report.weekEnd; else delete S.msDate[ds.ms]; S.actual[ds.ms]=t.checked?100:0; save(); renderHeader(); renderPage(); }
  else if(ds.pp){ const k=ds.pp; DRAFT.pages=t.checked?[...new Set([...DRAFT.pages,k])]:DRAFT.pages.filter(x=>x!==k); DRAFT.pages=PAGES.map(p=>p.k).filter(x=>DRAFT.pages.includes(x)); t.closest('label').classList.toggle('off',!t.checked); }
  else if(t.id==='mdy'){ SCHED_MDY=t.checked; }

    readScheduleFile(f).then(rows=>{ if(!rows.length) throw new Error('No activities found. Try the Excel or XML export.'); RAW=rows; DRAFT.schedFile=f.name; $('schedInfo').textContent=`${rows.length} activities read from ${f.name}. Check below, then save.`; $('schedReview').innerHTML=reviewHTML(rows); })
      .catch(err=>{ $('schedInfo').textContent=err.message; }); } });
document.addEventListener('click',async e=>{ const b=e.target.closest('button'); if(!b) return; const ds=b.dataset;
  if(ds.page){ go(ds.page); }
  else if(ds.filter!=null){ filterAll=ds.filter==='1'; renderPage(); }
  else if(ds.add){ const def=TDEF[ds.add]; if(S.tables[ds.add].length>=def.max){ toast(`The slide holds ${def.max} rows. Remove a closed item first.`); return; } S.tables[ds.add].push(def.cols.map(()=>'')); save(); renderPage(); }

async function sha256(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
(function lock(){ if(typeof SKIP_LOCK!=='undefined'&&SKIP_LOCK) return; let ok=false; try{ ok=localStorage.getItem(LOCK_KEY)===LOCK_HASH; }catch(e){} if(ok) return; $('lock').hidden=false;
  $('lockForm').addEventListener('submit',async e=>{ e.preventDefault(); if(await sha256($('lockPw').value.trim())===LOCK_HASH){ if($('lockRemember').checked){ try{ localStorage.setItem(LOCK_KEY,LOCK_HASH); }catch(err){} } $('lock').hidden=true; } else { $('lockErr').textContent='Wrong password. Try again.'; $('lockPw').select(); } });
